name: Synchronize ORCID biosketch
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:17 UTC; a successful run on main triggers a live deploy.
    - cron: "17 4 * * 1"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: orcid-biosketch 0000-0003-4820-7951 --config config/biosketch.json --output generated
      - name: Generate playful website artifacts
        run: |
          orcid-biosketch wrapped --biosketch generated/biosketch.json --json -o generated/wrapped.json
          orcid-biosketch card --biosketch generated/biosketch.json --qr ORCID.png -o generated/card.svg
          orcid-biosketch heatmap --biosketch generated/biosketch.json -o generated/heatmap.svg
          orcid-biosketch fortune --biosketch generated/biosketch.json --seed 0 -o generated/fortune.txt
      - name: Commit changed generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git diff --cached --quiet || git commit -m "chore: synchronize ORCID biosketch"
          git push

