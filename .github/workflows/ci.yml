name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: node --test web/srp-biosketch.test.mjs web/srp-group.test.mjs web/rename-compat.test.mjs web/network/app.test.mjs web/playground/digest.test.mjs web/playground/auth.test.mjs web/playground/teampack.test.mjs web/playground/feedback.test.mjs web/playground/group-link.test.mjs

  browser:
    # Shared navigation, deep links and 320px layout in Chromium, on the built site (#54).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: |
          npm --prefix demo install --ignore-scripts --no-audit --no-fund
          ./demo/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: .cache/pyodide-0.26.4
          key: pyodide-0.26.4-verified-runtime
      - run: python scripts/build_site.py site
      - run: node --test web/navigation.browser.test.mjs
        env:
          NODE_PATH: demo/node_modules
          SRP_REQUIRE_BROWSER: "1"
      # Dual-path homepage: layouts, keyboard order, consent and loading states (#53).
      - run: pytest -q tests/test_homepage.py -rs
        env:
          NODE_PATH: demo/node_modules
          SRP_REQUIRE_BROWSER: "1"
      # Guided first-run journeys and Studio → Contacts → Groups handoffs, desktop/375/320px (#56).
      - run: pytest -q tests/test_onboarding.py -rs
        env:
          NODE_PATH: demo/node_modules
          SRP_REQUIRE_BROWSER: "1"

  rules:
    # Firestore security rules for private team workspaces, in the emulator.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  exchange:
    # The ORCID → Firebase token-exchange function (functions/exchange).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/exchange
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q test_main.py
